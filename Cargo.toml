[package]
name = "me-xit"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/adapters",
    "crates/domain",
    "crates/ports",
    "crates/error",
    "crates/utils",
]

[dependencies]
actix-web = "4.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
adapters = { path = "./crates/adapters" }
regex = "1.13.1"

[dev-dependencies]
ports = { path = "./crates/ports" }
sqlx = { version = "0.9.0", features = ["macros", "migrate"] }
error = { path = "./crates/error" }
utils = { path = "./crates/utils" }
