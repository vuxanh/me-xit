[package]
name = "me-xit"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/adapters", "crates/domain", "crates/ports", "crates/error"]

[dependencies]
actix-web = "4.20.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
adapters = { path = "./crates/adapters" }

[dev-dependencies]
ports = { path = "./crates/ports" }
sqlx = { version = "0.9.0", features = ["macros", "migrate"] }
error = { path = "./crates/error" }
adapters = { path = "./crates/adapters" }
testcontainers = { version = "0.28.0" }
tokio = "1.54.1"
redis = { version = "1.8.1", features = ["tokio-comp"] }
dtor = "1.0.7"
