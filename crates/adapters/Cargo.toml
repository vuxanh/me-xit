[package]
name = "adapters"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.18.1"
argon2 = "0.6.0"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
redis = { version = "1.8.1", features = ["tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "uuid",
    "chrono",
] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }

domain = { path = "../domain" }
error = { path = "../error" }
ports = { path = "../ports" }

[lib]
path = "lib.rs"
